<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redachat - Main</title>
    <link rel="stylesheet" href="../static/styles/redachat.css" />
    <script
      type="module"
      defer
      src="../static/script/redachat-main.js"
    ></script>
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='img/own.png') }}"
      type="image/x-icon"
    />
  </head>
  <body>
    <header>
      <h1>
        <a href="/">Redachat</a>
      </h1>
      <div class="button-container">
        <button onclick="window.location.href = '/logout'">Sair</button>
      </div>
    </header>

    <div class="container">
      <aside>
        <h2>Historico de Redações</h2>
        <div class="historico" id="historico">
          <div class="login-message">
            <h3>Aqui é o historico de suas redações</h3>
            <p>Envie uma redação para ela aparecer aqui.</p>
          </div>
        </div>
        <a href="/historico" class="historico-link"> Ver todo o histórico </a>
      </aside>

      <main>
        <section class="user-area">
          <h2>Área de Redação</h2>
          <form>
            <select autocomplete="off">
              <option value="0">Escolher tema</option>
              <option value="1">Tema 1</option>
              <option value="2">Tema 2</option>
              <option value="3">Tema 3</option>
              <option value="4">Tema 4</option>
            </select>
            <textarea
              type="text"
              placeholder="Escreva aqui sua redação..."
            ></textarea>
          </form>
          <button class="button-submit" type="submit">Corrigir Redação</button>
          <button class="button-refazer">Refazer Analise</button>
        </section>

        <section class="chat-area">
          <div class="area-resposta">
            <h2>Área de Correção</h2>
            <div class="chat-resposta">
              <p>Aqui ficará a resposta da IA após o envio...</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="modal">
      <div class="dialog-container">
        <h2>Atenção!!</h2>
        <p>Modal de Alerta</p>
        <button onclick="modal.close()">Entendi</button>
      </div>
    </dialog>
  </body>
</html>
