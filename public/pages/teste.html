<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste — RedaChat</title>
<link rel="stylesheet" href="/static/css/base.css">
<style>
  .test-wrap{ max-width: 720px; margin: 60px auto; padding: 0 24px; }
  .test-wrap .card{ padding: 24px; margin-bottom: 16px; }
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .swatch{ width:64px; }
  .swatch .box{ height:44px; border-radius:8px; border:1px solid var(--border); }
  .swatch span{ font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="test-wrap">
  <p class="eyebrow">Página de teste</p>
  <h1 style="margin:8px 0 24px;">Componentes do RedaChat</h1>

  <div class="card">
    <h3 style="margin-bottom:14px;">Botões</h3>
    <div class="row" style="gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary">Primário</button>
      <button class="btn btn-outline">Outline</button>
      <button class="btn btn-ghost">Ghost</button>
      <button class="btn btn-danger">Perigo</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px;">Paleta</h3>
    <div class="swatches">
      <div class="swatch"><div class="box" style="background:var(--bg)"></div><span>bg</span></div>
      <div class="swatch"><div class="box" style="background:var(--surface)"></div><span>surface</span></div>
      <div class="swatch"><div class="box" style="background:var(--brand)"></div><span>brand</span></div>
      <div class="swatch"><div class="box" style="background:var(--correction)"></div><span>correction</span></div>
      <div class="swatch"><div class="box" style="background:var(--success)"></div><span>success</span></div>
      <div class="swatch"><div class="box" style="background:var(--paper)"></div><span>paper</span></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px;">Campo</h3>
    <div class="field">
      <label for="t1">Campo de exemplo</label>
      <input type="text" id="t1" placeholder="Digite algo...">
    </div>
  </div>
</div>
</body>
</html>
