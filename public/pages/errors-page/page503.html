<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serviço indisponível — RedaChat</title>
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='img/owl.svg') }}"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/errors.css" />
  </head>
  <body>
    <div class="error-shell">
      <div class="card error-card">
        <div class="brandmark">
          <svg
            viewBox="0 0 32 32"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="32" height="32" rx="9" fill="#4F8EF2" />
            <path
              d="M9 21.5V11c0-1.1.9-2 2-2h6.5c2.2 0 4 1.8 4 4s-1.8 4-4 4H12"
              stroke="#0B1A33"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M14.5 17.5 21 24"
              stroke="#0B1A33"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span>Reda<em>Chat</em></span>
        </div>

        <p class="error-code">ERRO 503</p>
        <img
          src="https://http.cat/503"
          alt="Erro 503 - Temporariamente Indisponível"
        />
        <h1>Estamos fora do ar por um instante.</h1>
        <p>
          O serviço está temporariamente indisponível, provavelmente por
          manutenção. Volte a tentar em alguns minutos.
        </p>

        <div class="error-actions">
          <a href="/" class="btn btn-primary">Tentar novamente</a>
        </div>
      </div>
    </div>
  </body>
</html>
