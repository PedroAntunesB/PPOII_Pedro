<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada — RedaChat</title>
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='img/owl.svg') }}"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/errors.css" />
  </head>
  <body>
    <div class="error-shell">
      <div class="card error-card">
        <div class="brandmark">
          <svg
            viewBox="0 0 32 32"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="32" height="32" rx="9" fill="#4F8EF2" />
            <path
              d="M9 21.5V11c0-1.1.9-2 2-2h6.5c2.2 0 4 1.8 4 4s-1.8 4-4 4H12"
              stroke="#0B1A33"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M14.5 17.5 21 24"
              stroke="#0B1A33"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span>Reda<em>Chat</em></span>
        </div>

        <p class="error-code">ERRO 404</p>
        <img
          src="https://http.cat/404"
          alt="Erro 404 - Página não encontrada"
        />

        <h1>Essa página saiu de pauta.</h1>
        <p>
          Não encontramos o que você procurava. Ela pode ter sido movida,
          renomeada ou nunca ter existido.
        </p>

        <div class="error-actions">
          <a href="/" class="btn btn-primary">Voltar para o início</a>
          <a href="/login-page" class="btn btn-ghost">Ir para o login</a>
        </div>
      </div>
    </div>
  </body>
</html>
